<!doctype html><html lang="et"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mari külmkapp vajab korrastamist</title>
<style>
:root{--bg:#f7efe3;--paper:#fffdf8;--ink:#4b392d;--muted:#7e6b5c;--orange:#d97830;--green:#667d50;--green2:#e8efdf;--red:#b85d4d;--red2:#f8e5df;--line:#e5d3bd}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}button{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:270px 1fr}
aside{background:#efddc5;border-right:1px solid #dcc4a7;padding:32px 23px;position:relative}.brand{font:800 27px/1.05 Georgia,serif}.brand span{color:var(--orange)}.course{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:10px}
.track{height:9px;background:#ddc7ac;border-radius:20px;overflow:hidden;margin:9px 0 24px}.fill{height:100%;background:var(--orange);transition:.3s}.steps{display:grid;gap:8px}.step{padding:8px;border-radius:11px;color:#756253;font-size:13px}.step.active{background:#fff5e8;font-weight:800}.step.done{color:var(--green)}.decor{position:absolute;bottom:22px;font-size:54px}
main{padding:28px}.top,.card{max-width:1080px;margin:auto}.top{display:flex;justify-content:space-between;color:var(--muted);font-weight:800}.tag{color:var(--orange);text-transform:uppercase;font-size:12px;letter-spacing:.06em}.card{margin-top:14px;background:var(--paper);border:1px solid var(--line);border-radius:27px;padding:38px;min-height:680px;box-shadow:0 18px 48px #6d4b2a1a}
.eyebrow{color:var(--green);font-weight:900;text-transform:uppercase;font-size:12px;letter-spacing:.07em}h1{font:800 39px/1.07 Georgia,serif;margin:8px 0 12px}.lead{font-size:18px;line-height:1.55;color:#675548;max-width:830px}
.options{display:grid;gap:10px;margin-top:22px}.option{padding:15px;text-align:left;border:1.5px solid var(--line);border-radius:14px;background:white;cursor:pointer;color:var(--ink)}.option:hover,.option.selected{border-color:var(--orange);background:#fff3e4}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:16px;margin:20px 0}table{width:100%;border-collapse:collapse;background:white;font-size:14px}th{background:#f2e2cc}th,td{padding:12px;border-bottom:1px solid #eee0d0;white-space:nowrap}td.clickable{cursor:pointer}td.clickable:hover,td.sel{background:#fff0dc;outline:3px solid var(--orange);outline-offset:-3px}
.feedback{display:none;margin-top:18px;padding:14px 16px;border-radius:14px}.feedback.show{display:block}.good{background:var(--green2);border:1px solid #c6d5b8}.no{background:var(--red2);border:1px solid #e3b8ae}
.actions{display:flex;justify-content:space-between;margin-top:28px;gap:12px}.btn{border:0;border-radius:13px;padding:13px 19px;font-weight:850;cursor:pointer}.primary{background:var(--orange);color:white}.ghost{background:#eee3d5}.btn:disabled{opacity:.35;cursor:not-allowed}
.checks label{display:block;background:white;border:1px solid var(--line);border-radius:13px;padding:13px;margin:9px 0}.checks input{margin-right:9px}
.tokens{display:flex;flex-wrap:wrap;gap:9px;margin:20px 0}.token{padding:9px 12px;border:1px solid #d7bea0;border-radius:11px;background:#efddc5;font-weight:750;cursor:grab}.dd{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.bucket{min-height:155px;border:2px dashed #d6bea1;border-radius:16px;padding:12px;background:#fff9f1}.bucket h3{font-family:Georgia,serif;margin:0 0 9px}.bucket .token{display:inline-block;margin:4px}
.final{text-align:center;padding:28px}.secret{display:inline-block;padding:14px 24px;border:2px dashed var(--orange);border-radius:15px;font:800 34px Georgia,serif;letter-spacing:.12em;color:var(--orange);background:#fff4e5}
@media(max-width:800px){.app{grid-template-columns:1fr}aside{display:none}main{padding:14px}.card{padding:24px;min-height:0}h1{font-size:31px}.dd{grid-template-columns:1fr}}
</style></head><body><div class="app"><aside><div class="brand">Mari külmkapp<br><span>vajab korrastamist</span></div><div class="course">RKE134 · Andmebaaside alused</div><p><b id="sidecount">1 / 20</b></p><div class="track"><div class="fill" id="fill"></div></div><div class="steps" id="steps"></div><div class="decor">📚 🌿</div></aside>
<main><div class="top"><div class="tag">Iseseisev interaktiivne ülesanne</div><div id="count">1 / 20</div></div><section class="card"><div id="content"></div></section></main></div>
<script>
const rows=[["1","Piim","Piimatooted","2","ülemine riiul","Laktoosivaba"],["2","Jogurt","Piimatooted","4","ülemine riiul","Hommikusöögiks"],["3","Õun, pirn","Puuviljad","6","alumine sahtel","Mari lemmikud"],["4","Juust","Piimatooted","1","ülemine riiul","—"]];
const Q=[
["1NF","Leia probleemne väärtus","Mari külmkapi tabelis on üks väli, mis rikub 1NF põhimõtet. Klõpsa probleemsel lahtril.","cell","2-1","Õige! Ühes väljas on kaks toodet: „Õun, pirn“.","Otsi lahtrit, kus on mitu eraldi väärtust."],
["1NF","Miks on „Õun, pirn“ probleem?","Vali kõige täpsem selgitus.","one",1,"Ühte välja on salvestatud kaks erinevat toodet.","Mõtle: üks väli = üks väärtus.",["Sest väärtus sisaldab koma.","Sest ühte välja on salvestatud kaks erinevat toodet.","Sest tootenimed peavad olema numbrid.","Sest sõna „pirn“ on liiga lühike."]],
["1NF","Kuidas väärtust parandada?","Milline lahendus sobib kõige paremini?","one",2,"Õun ja Pirn peaksid olema eraldi kirjed.","Eraldi objektid vajavad eraldi kirjeid.",["Jätta „Õun, pirn“ samasse välja.","Kirjutada „Õun + pirn“.","Salvestada Õun ja Pirn eraldi kirjetena.","Kirjutada väärtus suurtähtedega."]],
["1NF","Kas „Mari Maasikas“ rikub 1NF reeglit?","Nimes on kaks sõna. Kas see tähendab automaatselt kahte väärtust?","one",1,"Ei. See võib selles kontekstis olla üks terviklik väärtus.","Atomaarne väärtus sõltub tähendusest.",["Jah","Ei"]],
["1NF","Aga „Piim, Jogurt, Juust“?","Kas selline väärtus sobib ühe toote nime väljale?","one",1,"Ei. Need on kolm erinevat toodet.","Mõtle, mitu objekti siin kirjeldatakse.",["Jah","Ei"]],
["1NF","Milline väärtus on atomaarne?","Vali väärtus, mis kirjeldab ühte asja.","one",2,"„Laktoosivaba piim“ on ühe toote nimetus.","Ära loe sõnu, vaid asju.",["Piim, Jogurt","Õun; pirn; banaan","Laktoosivaba piim","K001, K002"]],
["Liiasus","Milline info kordub?","Milline kirjeldav väärtus kordub mitme toote juures?","one",0,"„Piimatooted“ kordub mitmes reas.","Otsi sama teksti mitmest kirjest.",["Piimatooted","Jogurt","6","Mari lemmikud"]],
["Liiasus","Kas iga kordus on viga?","Kas sama väärtuse kordumine tähendab alati, et andmebaasi struktuur on halb?","one",1,"Õige! Normaliseerimise eesmärk ei ole eemaldada andmebaasist kõiki korduvaid väärtusi.","Mõtle: kas iga korduv väärtus tähendab tingimata, et andmed on valesti korraldatud?",["Jah, alati.","Ei. Mõni kordus võib olla täiesti normaalne."]],
["Anomaaliad","Milline anomaalia tekkis?","„Piimatooted“ esineb 12 reas. Mari muudab nime 11 reas, üks jääb vanaks.","one",1,"See on UPDATE-anomaalia.","Probleem tekkis olemasoleva info muutmisel.",["INSERT-anomaalia","UPDATE-anomaalia","DELETE-anomaalia"]],
["Anomaaliad","Uus toode, aga külmkapi sisud veel pole","Halb tabel lubab toodet lisada ainult koos külmkapi sisu andmetega. Mis probleem see on?","one",0,"See on INSERT-anomaalia.","Probleem tekib uue info lisamisel.",["INSERT-anomaalia","UPDATE-anomaalia","DELETE-anomaalia"]],
["Anomaaliad","Viimane mango kaob","Viimase Mango külmkapi sisu kustutamisel kaob ka ainus info Mango kohta.","one",2,"See on DELETE-anomaalia.","Probleem tekib kustutamisel.",["INSERT-anomaalia","UPDATE-anomaalia","DELETE-anomaalia"]],
["Struktuur","Kuhu need andmed kuuluvad?","Toode kirjeldab toodet ennast, Kategooria selle rühma ja Külmkapi sisu seda, mis praegu Mari külmkapis on. Lohista kaardid sobivatesse tabelitesse.","drag",[["Piim","Toode"],["Piimatooted","Kategooria"],["2 pakki","Külmkapi sisu"],["ülemine riiul","Külmkapi sisu"],["05.10.2026","Külmkapi sisu"]],"Kõik andmed on õiges tabelis.","Mõtle: kas väärtus kirjeldab toodet, selle kategooriat või Mari külmkapis olevat konkreetset kogust."],
["Struktuur","Mida kirjeldab tabel „Külmkapi sisu“?","Mida peaksime sellesse tabelisse salvestama?","one",1,"Õige! See tabel kirjeldab seda, millised tooted ja kui palju neid praegu Mari külmkapis on.","Mõtle, kas tabel kirjeldab toodet ennast või Mari külmkapi praegust sisu.",["Toote nime ja kategooria nime","Seda, millised tooted ja kui palju neid praegu Mari külmkapis on","Kõigi võimalike toodete nimekirja","Ainult toodete kategooriaid"]],
["Normaliseerimine","Mis kirjeldab toodet ennast?","Milline väärtus kirjeldab toodet ennast, mitte seda, mis Mari külmkapis praegu olemas on?","one",0,"„Piim“ kirjeldab toodet ennast.","Erista toote püsiv info kogusest, asukohast ja kuupäevast.",["Piim","2 pakki","ülemine riiul","05.10.2026"]],
["Normaliseerimine","Mis juhtub, kui piim saab otsa?","Mari joob viimase piima ära. Kas info toote „Piim“ kohta peab andmebaasist kaduma?","one",1,"Ei. Külmkapi sisu muutub, kuid toode „Piim“ võib toodete tabelisse alles jääda.","Mõtle eraldi tootele ja sellele, kas seda on parajasti külmkapis.",["Jah","Ei","Ainult siis, kui kategooria kustutatakse","Ainult siis, kui piim oli ülemisel riiulil"]],
["Normaliseerimine","Mari ostab sama piima uuesti","Nädal hiljem ostab Mari sama toodet „Piim“ uuesti. Kas tabelisse Toode tuleb luua veel üks uus „Piim“?","one",1,"Ei. Toode on juba olemas; muutub ainult Mari külmkapi sisu.","Mõtle: kas andmebaasi lisandus uus toode või muutus ainult selle kogus külmkapis?",["Jah","Ei","Jah, kui kogus on erinev","Jah, kui asukoht külmkapis muutub"]],
["Normaliseerimine","Miks on eraldi tabelid kasulikud?","Mis on üks oluline põhjus hoida toote info ja külmkapi sisu eraldi?","one",0,"Nii ei pea sama toote infot iga uue ostu või koguse puhul uuesti sisestama.","Mõtle, milline info jääb samaks ka siis, kui Mari ostab toodet mitu korda.",["Toote infot ei pea iga ostu puhul uuesti sisestama.","Ühte välja saab siis salvestada rohkem väärtusi.","Kõik korduvad väärtused kaovad andmebaasist.","Toote nimi muutub automaatselt lühemaks."]],
["Praktika","Mari ostis esimest korda mangot","Kategooria „Puuviljad“ on juba olemas, kuid toodet „Mango“ veel ei ole. Millistesse tabelitesse tuleb lisada uus kirje?","multi",[1,2],"Uus toode Mango lisatakse tabelisse Toode ning info külmkapis oleva mango kohta tabelisse Külmkapi sisu.","Kategooria on juba olemas. Mõtle eraldi tootele ja sellele, mis Mari külmkapis praegu olemas on.",["Kategooria","Toode","Külmkapi sisu"]],
["Praktika","Mari ostis veel ühe sama piima","„Laktoosivaba piim“ on juba andmebaasis. Mari ostab veel ühe paki. Kas tabelisse Toode tuleb lisada uus „Piim“?","one",1,"Õige! Toode on juba olemas. Muutub ainult info selle kohta, kui palju seda toodet Mari külmkapis on.","Mõtle: kas Mari ostis uue toote või lihtsalt sama toodet juurde?",["Jah","Ei"]],
["Kokkuvõte","Vali õiged väited","Millised väited kirjeldavad hästi normaliseeritud Mari külmkapi andmebaasi?","multi",[0,2,4],"Suurepärane! Sa mõistad normaliseerimise praktilist mõtet.","Vali väited, mis vähendavad liiasust ja annavad andmetele selge tähenduse.",["Sama kirjeldavat infot tuleb vähem dubleerida.","Kõik andmed tuleb panna ühte suurde tabelisse.","Andmeid on lihtsam järjepidevalt muuta.","Ühte välja võib salvestada mitme toote loendi.","Toode, Kategooria ja Külmkapi sisu võivad olla eraldi tabelid."]]
];
let i=0,sol=Array(20).fill(false),sel=null,multi=new Set();
const groups=["1NF","Liiasus","Anomaaliad","Struktuur","Normaliseerimine","Praktika","Kokkuvõte"];
function sidebar(){steps.innerHTML=groups.map(g=>{let ids=Q.map((q,j)=>q[0]==g?j:-1).filter(x=>x>=0),d=ids.every(x=>sol[x]),a=ids.includes(i);return `<div class="step ${d?'done':''} ${a?'active':''}">${d?'✓ ':''}${g}</div>`}).join("")}
function table(){return `<div class="tablewrap"><table><tr><th>id</th><th>toode</th><th>kategooria</th><th>kogus</th><th>asukoht</th><th>märkused</th></tr>${rows.map((r,ri)=>`<tr>${r.map((v,ci)=>`<td class="clickable" data-c="${ri}-${ci}">${v}</td>`).join("")}</tr>`).join("")}</table></div>`}
function render(){sel=null;multi=new Set();let q=Q[i];count.textContent=sidecount.textContent=`${i+1} / 20`;fill.style.width=`${(i+1)*5}%`;sidebar();let x=`<div class="eyebrow">${q[0]}</div><h1>${q[1]}</h1><p class="lead">${q[2]}</p>`;
if(q[3]=="cell")x+=table();
if(q[3]=="one")x+=`<div class="options">${q[7].map((o,n)=>`<button class="option" data-o="${n}">${o}</button>`).join("")}</div>`;
if(q[3]=="multi")x+=`<div class="checks">${q[7].map((o,n)=>`<label><input type="checkbox" data-m="${n}"> ${o}</label>`).join("")}</div>`;
if(q[3]=="drag")x+=`<div class="tokens" id="pool">${q[4].map((t,n)=>`<div class="token" draggable="true" data-t="${n}">${t[0]}</div>`).join("")}</div><div class="dd">${["Toode","Kategooria","Külmkapi sisu"].map(b=>`<div class="bucket" data-b="${b}"><h3>${b}</h3></div>`).join("")}</div>`;
x+=`<div class="feedback" id="fb"></div><div class="actions"><button class="btn ghost" id="back" ${i==0?'disabled':''}>← Tagasi</button><div><button class="btn primary" id="check">Kontrolli</button> <button class="btn primary" id="next" ${sol[i]?'':'disabled'}>${i==19?'Tulemus':'Edasi →'}</button></div></div>`;content.innerHTML=x;bind()}
function bind(){let q=Q[i];document.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-o]").forEach(z=>z.classList.remove("selected"));b.classList.add("selected");sel=+b.dataset.o});document.querySelectorAll("[data-m]").forEach(c=>c.onchange=()=>c.checked?multi.add(+c.dataset.m):multi.delete(+c.dataset.m));document.querySelectorAll("[data-c]").forEach(c=>c.onclick=()=>{document.querySelectorAll("[data-c]").forEach(z=>z.classList.remove("sel"));c.classList.add("sel");sel=c.dataset.c});
if(q[3]=="drag"){let d;document.querySelectorAll(".token").forEach(t=>t.ondragstart=()=>d=t);document.querySelectorAll(".bucket,#pool").forEach(b=>{b.ondragover=e=>e.preventDefault();b.ondrop=e=>{e.preventDefault();if(d)b.appendChild(d)}})}
check.onclick=verify;back.onclick=()=>{if(i){i--;render()}};next.onclick=()=>{if(!sol[i])return;if(i==19)finish();else{i++;render()}}}
function verify(){let q=Q[i],ok=false;if(q[3]=="one"||q[3]=="cell")ok=sel===q[4];if(q[3]=="multi")ok=JSON.stringify([...multi].sort())===JSON.stringify([...q[4]].sort());if(q[3]=="drag"){ok=true;q[4].forEach((t,n)=>{let e=document.querySelector(`[data-t="${n}"]`),b=e.closest(".bucket");if(!b||b.dataset.b!=t[1])ok=false})}fb.className=`feedback show ${ok?'good':'no'}`;fb.innerHTML=`<b>${ok?'✓ Õige!':'Proovi veel.'}</b><br>${ok?q[5]:q[6]}`;if(ok){sol[i]=true;next.disabled=false;sidebar()}}
function finish(){content.innerHTML=`<div class="final"><div style="font-size:60px">🥕 ✓</div><div class="eyebrow">Ülesanne lõpetatud</div><h1>Mari külmkapp on korrastatud!</h1><p class="lead" style="margin:auto">Sa lahendasid kõik 20 sammu ja näitasid, et oskad normaliseerimise põhimõtteid praktiliselt kasutada.</p><p style="margin-top:30px">Sisesta Moodle'i ülesandesse salasõna:</p><div class="secret">STRUKTUUR</div></div>`;count.textContent="20 / 20 ✓";fill.style.width="100%"}
render();
</script></body></html>
